name: Simple Python Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Execute script
        run: python dev/scr/script.py
